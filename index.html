<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>School Grading System</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f4f4f4;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.container{
    width:500px;
    background:#fff;
    padding:25px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.2);
}

h1{
    text-align:center;
    color:#2c3e50;
    margin-bottom:20px;
}

label{
    display:block;
    margin-top:10px;
    font-weight:bold;
}

input{
    width:100%;
    padding:10px;
    margin-top:5px;
    border:1px solid #ccc;
    border-radius:5px;
}

button{
    width:100%;
    padding:12px;
    margin-top:20px;
    background:#3498db;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#2980b9;
}

.result{
    margin-top:20px;
    background:#ecf0f1;
    padding:15px;
    border-radius:5px;
}

.pass{
    color:green;
    font-weight:bold;
}

.fail{
    color:red;
    font-weight:bold;
}
</style>

</head>
<body>

<div class="container">

<h1>School Grading System</h1>

<label>Student Name</label>
<input type="text" id="name">

<label>Mathematics</label>
<input type="number" id="math" min="0" max="100">

<label>English</label>
<input type="number" id="english" min="0" max="100">

<label>Science</label>
<input type="number" id="science" min="0" max="100">

<label>Social Studies</label>
<input type="number" id="social" min="0" max="100">

<label>Computer</label>
<input type="number" id="computer" min="0" max="100">

<button onclick="calculateGrade()">Calculate Result</button>

<div id="output" class="result"></div>

</div>

<script>

function calculateGrade(){

    let name=document.getElementById("name").value;

    let math=Number(document.getElementById("math").value);
    let english=Number(document.getElementById("english").value);
    let science=Number(document.getElementById("science").value);
    let social=Number(document.getElementById("social").value);
    let computer=Number(document.getElementById("computer").value);

    if(name==""){
        alert("Please enter student name.");
        return;
    }

    if(
        math>100||english>100||science>100||
        social>100||computer>100||
        math<0||english<0||science<0||
        social<0||computer<0
    ){
        alert("Marks must be between 0 and 100.");
        return;
    }

    let total=math+english+science+social+computer;
    let average=total/5;

    let grade="";
    let status="";

    if(average>=80){
        grade="A";
    }
    else if(average>=70){
        grade="B";
    }
    else if(average>=60){
        grade="C";
    }
    else if(average>=50){
        grade="D";
    }
    else{
        grade="F";
    }

    if(average>=50){
        status="<span class='pass'>PASS</span>";
    }else{
        status="<span class='fail'>FAIL</span>";
    }

    document.getElementById("output").innerHTML=
    `
    <h2>Student Report</h2>
    <hr>
    <p><strong>Name:</strong> ${name}</p>
    <p><strong>Total Marks:</strong> ${total} / 500</p>
    <p><strong>Average:</strong> ${average.toFixed(2)}%</p>
    <p><strong>Grade:</strong> ${grade}</p>
    <p><strong>Status:</strong> ${status}</p>
    `;

}

</script>

</body>
</html>
